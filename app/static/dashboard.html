<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TV9 — Broadcast Rundown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0d12;
        --bg-grain: #0e1015;
        --card: #14171c;
        --card-hover: #171b21;
        --border: #242832;
        --border-soft: #1c2028;
        --text: #eef0f3;
        --muted: #8992a3;
        --dim: #565d6b;
        --crimson: #e6193c;
        --crimson-dim: #7a0e21;
        --crimson-glow: rgba(230, 25, 60, 0.35);
        --green: #34d399;
        --amber: #fbbf24;
        --red: #f87171;
        --blue: #6ea8fe;
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background:
          radial-gradient(
            ellipse 900px 500px at 12% -10%,
            rgba(230, 25, 60, 0.08),
            transparent 60%
          ),
          var(--bg);
        color: var(--text);
        font-family:
          "Inter",
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        margin: 0;
        padding: 28px 32px 80px;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--crimson-glow);
      }

      /* ---------- Header ---------- */
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        padding-bottom: 22px;
        margin-bottom: 22px;
        border-bottom: 1px solid var(--border-soft);
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .live-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--crimson);
        box-shadow: 0 0 0 0 var(--crimson-glow);
        animation: livepulse 1.8s infinite;
        flex-shrink: 0;
      }
      @keyframes livepulse {
        0% {
          box-shadow: 0 0 0 0 var(--crimson-glow);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(230, 25, 60, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(230, 25, 60, 0);
        }
      }

      h1 {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 30px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin: 0;
        line-height: 1;
      }
      h1 .accent {
        color: var(--crimson);
      }
      h1 .thin {
        color: var(--muted);
        font-weight: 600;
      }

      .subline {
        font-family: "JetBrains Mono", monospace;
        color: var(--muted);
        font-size: 11.5px;
        margin: 8px 0 0;
        letter-spacing: 0.2px;
      }
      .subline .k-real {
        color: var(--green);
        font-weight: 500;
      }
      .subline .k-demo {
        color: var(--amber);
        font-weight: 500;
      }

      .user-switcher {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 9px 14px;
        margin-top: 12px;
      }
      .user-switcher label {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 13px;
        border-radius: 7px;
        padding: 9px 16px;
        cursor: pointer;
        border: none;
        transition:
          transform 0.12s ease,
          box-shadow 0.15s ease,
          background 0.15s ease,
          border-color 0.15s ease;
        position: relative;
      }
      button:active {
        transform: scale(0.96);
      }

      button.primary,
      .controls button:not(.secondary) {
        background: var(--crimson);
        color: #fff;
        box-shadow: 0 2px 12px -4px var(--crimson-glow);
      }
      button.primary:hover,
      .controls button:not(.secondary):hover {
        background: #ff2447;
        box-shadow: 0 4px 18px -3px var(--crimson-glow);
      }

      button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      button.secondary:hover {
        border-color: var(--dim);
        color: var(--text);
      }

      select,
      input {
        background: #1a1e25;
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 9px 11px;
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 13px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
        outline: none;
      }
      select:focus,
      input:focus {
        border-color: var(--crimson);
        box-shadow: 0 0 0 3px var(--crimson-glow);
      }
      input::placeholder {
        color: var(--dim);
      }

      /* ---------- Badges ---------- */
      .badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 9.5px;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 4px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      .badge.real {
        background: rgba(52, 211, 153, 0.12);
        color: var(--green);
        border: 1px solid rgba(52, 211, 153, 0.25);
      }
      .badge.demo {
        background: rgba(251, 191, 36, 0.12);
        color: var(--amber);
        border: 1px solid rgba(251, 191, 36, 0.25);
      }
      .badge.admin {
        background: rgba(110, 168, 254, 0.12);
        color: var(--blue);
        border: 1px solid rgba(110, 168, 254, 0.25);
      }
      .badge.content-manager {
        background: rgba(230, 25, 60, 0.12);
        color: #ff6b85;
        border: 1px solid rgba(230, 25, 60, 0.25);
      }

      /* ---------- Create panel ---------- */
      .create-panel {
        background: linear-gradient(180deg, var(--card), #121519);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 22px;
        margin-bottom: 26px;
        position: relative;
        overflow: hidden;
      }
      .create-panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--crimson), transparent 70%);
      }
      .panel-title {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .panel-fields {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .panel-fields > * {
        width: 100%;
      }
      .panel-fields button {
        align-self: flex-start;
        margin-top: 4px;
      }

      /* ---------- Rundown ---------- */
      .rundown-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .rundown-head .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .rundown-head .line {
        flex: 1;
        height: 1px;
        background: var(--border-soft);
      }

      .posts {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .post-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 20px 16px 0;
        display: flex;
        gap: 0;
        position: relative;
        overflow: hidden;
        animation: fadein 0.35s ease both;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          transform 0.15s ease;
      }
      @keyframes fadein {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .post-card:hover {
        background: var(--card-hover);
        border-color: #2e3340;
      }
      .post-card::after {
        content: "";
        position: absolute;
        top: -40%;
        left: -60%;
        width: 40%;
        height: 180%;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.03),
          transparent
        );
        transform: skewX(-20deg) translateX(-120%);
        transition: transform 0.6s ease;
        pointer-events: none;
      }
      .post-card:hover::after {
        transform: skewX(-20deg) translateX(320%);
      }

      .seg-number {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--dim);
        width: 52px;
        flex-shrink: 0;
        padding-top: 2px;
        text-align: center;
        border-right: 1px solid var(--border-soft);
      }

      .post-body {
        flex: 1;
        padding-left: 20px;
        min-width: 0;
      }

      .post-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .post-title {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .post-caption {
        font-size: 13px;
        color: var(--muted);
        margin: 3px 0 14px;
        line-height: 1.4;
      }

      .targets {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .target {
        display: flex;
        flex-direction: column;
        gap: 3px;
        background: #1a1e25;
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        max-width: 280px;
        transition:
          border-color 0.2s ease,
          transform 0.12s ease;
      }
      .target:hover {
        border-color: #333947;
        transform: translateY(-1px);
      }

      .target-main {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .target-main strong {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        letter-spacing: 0.3px;
        font-size: 11px;
      }
      .target-status {
        color: var(--muted);
        font-size: 11px;
      }
      .target a {
        color: var(--blue);
        text-decoration: none;
        font-size: 11px;
      }
      .target a:hover {
        text-decoration: underline;
      }

      .target button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 5px;
        padding: 3px 9px;
        font-size: 10.5px;
        font-weight: 500;
        margin-left: 2px;
      }
      .target button:hover {
        border-color: var(--crimson);
        color: #ff6b85;
        background: rgba(230, 25, 60, 0.08);
      }

      .target-error {
        color: var(--red);
        font-size: 10.5px;
        line-height: 1.35;
        font-family: "JetBrains Mono", monospace;
      }

      .publish-all-btn {
        background: rgba(52, 211, 153, 0.1) !important;
        border: 1px solid rgba(52, 211, 153, 0.35) !important;
        color: var(--green) !important;
      }
      .publish-all-btn:hover {
        background: rgba(52, 211, 153, 0.18) !important;
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.12);
      }

      /* status dots */
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
      }
      .dot.pending {
        background: var(--dim);
      }
      .dot.publishing {
        background: var(--amber);
        box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.5);
        animation: onair 1s infinite;
      }
      @keyframes onair {
        0% {
          box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55);
        }
        70% {
          box-shadow: 0 0 0 6px rgba(251, 191, 36, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(251, 191, 36, 0);
        }
      }
      .dot.published {
        background: var(--green);
      }
      .dot.failed {
        background: var(--red);
      }

      /* ---------- YouTube channel strip ---------- */
      .yt-strip {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .yt-strip .yt-strip-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .yt-chip {
        display: flex;
        align-items: center;
        gap: 7px;
        background: linear-gradient(180deg, #1a1416, #14100f);
        border: 1px solid rgba(255, 0, 51, 0.25);
        border-radius: 20px;
        padding: 6px 12px 6px 8px;
        font-size: 12.5px;
        transition: border-color 0.2s ease, transform 0.15s ease;
      }
      .yt-chip:hover {
        border-color: rgba(255, 0, 51, 0.5);
        transform: translateY(-1px);
      }
      .yt-chip svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .yt-chip .yt-chip-name {
        font-weight: 600;
        color: var(--text);
      }
      .yt-chip .yt-chip-live {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
        animation: livepulse 1.8s infinite;
        margin-left: 2px;
      }
      .yt-empty {
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px;
        color: var(--dim);
      }

      /* ---------- YouTube target enhancements ---------- */
      .target.yt-target {
        border-color: rgba(255, 0, 51, 0.18);
        max-width: 340px;
      }
      .target.yt-target:hover {
        border-color: rgba(255, 0, 51, 0.4);
      }
      .target-attempts {
        color: var(--dim);
        font-size: 10px;
        font-family: "JetBrains Mono", monospace;
      }

      .yt-progress-track {
        width: 100%;
        height: 3px;
        background: #262a33;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 2px;
      }
      .yt-progress-fill {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, var(--amber), #ff6b6b);
        border-radius: 2px;
        animation: ytupload 1.2s ease-in-out infinite;
      }
      @keyframes ytupload {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }

      .yt-embed-wrap {
        margin-top: 8px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border-soft);
        aspect-ratio: 16 / 9;
        max-width: 300px;
      }
      .yt-embed-wrap iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: none;
      }

      .retry-btn {
        border-color: var(--amber) !important;
        color: var(--amber) !important;
      }
      .retry-btn:hover {
        background: rgba(251, 191, 36, 0.1) !important;
      }

      /* ---------- KPI strip ---------- */
      .kpi-strip {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 22px;
      }
      .kpi-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: border-color 0.2s ease, transform 0.15s ease;
      }
      .kpi-card:hover {
        transform: translateY(-1px);
        border-color: #2e3340;
      }
      .kpi-value {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 28px;
        line-height: 1;
      }
      .kpi-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .kpi-card.total .kpi-value { color: var(--text); }
      .kpi-card.published .kpi-value { color: var(--green); }
      .kpi-card.pending .kpi-value { color: var(--muted); }
      .kpi-card.failed .kpi-value { color: var(--red); }
      @media (max-width: 640px) {
        .kpi-strip { grid-template-columns: repeat(2, 1fr); }
      }

      .delete-btn {
        background: transparent !important;
        border: 1px solid var(--border) !important;
        color: var(--dim) !important;
      }
      .delete-btn:hover {
        border-color: var(--red) !important;
        color: var(--red) !important;
        background: rgba(248, 113, 113, 0.08) !important;
      }

      .empty {
        color: var(--dim);
        font-size: 13px;
        padding: 60px 0;
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 18px;
        }
        .post-card {
          padding-left: 0;
        }
        .seg-number {
          width: 34px;
          font-size: 10px;
        }
        .post-body {
          padding-left: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="brand-row">
          <span class="live-dot"></span>
          <h1>
            TV9 <span class="thin">/</span> <span class="accent">Rundown</span>
          </h1>
        </div>
        <p class="subline">
          <span class="k-real">REAL</span> — published live via the platform's
          own API &nbsp;·&nbsp; <span class="k-demo">DEMO</span> — simulated, no
          external call made
        </p>
        <div class="user-switcher">
          <label>Viewing as</label>
          <select id="user-switcher" onchange="onUserChange()"></select>
          <span id="role-badge"></span>
        </div>
      </div>
      <div class="controls">
        <button class="secondary" onclick="callDemo('reset')">Reset</button>
        <button class="secondary" onclick="callDemo('seed')">
          Seed demo data
        </button>
        <button onclick="callDemo('simulate')">Advance publishing</button>
      </div>
    </header>

    <div class="create-panel" id="create-form">
      <div class="panel-title">New segment</div>
      <div class="panel-fields">
        <input id="cf-title" placeholder="Title" />
        <input id="cf-caption" placeholder="Caption" />
        <input
          id="cf-media"
          placeholder="Filename in /app/media/ (e.g. test_clip.mp4)"
        />
        <select id="cf-account"></select>
        <button onclick="createRealPost()">Create + publish now</button>
      </div>
    </div>

    <div class="yt-strip">
      <span class="yt-strip-label">YouTube channels</span>
      <div id="yt-channel-list" style="display:flex; gap:10px; flex-wrap:wrap;">
        <span class="yt-empty">Loading…</span>
      </div>
    </div>

    <div id="kpi-strip" class="kpi-strip">
      <div class="kpi-card total">
        <span class="kpi-value" id="kpi-total">–</span>
        <span class="kpi-label">Total posts</span>
      </div>
      <div class="kpi-card published">
        <span class="kpi-value" id="kpi-published">–</span>
        <span class="kpi-label">Published</span>
      </div>
      <div class="kpi-card pending">
        <span class="kpi-value" id="kpi-pending">–</span>
        <span class="kpi-label">Pending</span>
      </div>
      <div class="kpi-card failed">
        <span class="kpi-value" id="kpi-failed">–</span>
        <span class="kpi-label">Failed</span>
      </div>
    </div>

    <div class="rundown-head">
      <span class="eyebrow">Today's rundown</span>
      <span class="line"></span>
    </div>

    <div id="posts" class="posts"></div>

    <script>
      let API_KEY = null;
      let CURRENT_USER_EMAIL = ""; // empty string = no user context = unrestricted (matches backend default)
      let ALL_USERS = [];

      async function initAuth() {
        const res = await fetch("/dashboard-config");
        const config = await res.json();
        API_KEY = config.api_key;
      }

      async function authedFetch(url, opts = {}) {
        const headers = { ...(opts.headers || {}), "X-API-Key": API_KEY || "" };
        if (CURRENT_USER_EMAIL) headers["X-User-Email"] = CURRENT_USER_EMAIL;
        return fetch(url, { ...opts, headers });
      }

      async function loadUserSwitcher() {
        const res = await authedFetch("/users/");
        ALL_USERS = res.ok ? await res.json() : [];
        const select = document.getElementById("user-switcher");
        const options = [
          '<option value="">(no user — unrestricted, admin-equivalent)</option>',
        ].concat(
          ALL_USERS.map(
            (u) =>
              `<option value="${u.email}">${u.display_name} (${u.email})</option>`,
          ),
        );
        select.innerHTML = options.join("");
        updateRoleBadge();
      }

      function updateRoleBadge() {
        const badgeEl = document.getElementById("role-badge");
        if (!CURRENT_USER_EMAIL) {
          badgeEl.innerHTML = '<span class="badge admin">Unrestricted</span>';
          return;
        }
        const user = ALL_USERS.find((u) => u.email === CURRENT_USER_EMAIL);
        if (!user) {
          badgeEl.innerHTML = "";
          return;
        }
        badgeEl.innerHTML = user.is_admin
          ? '<span class="badge admin">Admin</span>'
          : '<span class="badge content-manager">Content manager</span>';
      }

      async function onUserChange() {
        CURRENT_USER_EMAIL = document.getElementById("user-switcher").value;
        LAST_POSTS_SNAPSHOT = null; // force a fresh render for the new user/role
        updateRoleBadge();
        await loadAccounts();
        await loadYoutubeChannels();
        await fetchPosts();
      }

      const YT_ICON = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M23.5 6.2s-.2-1.6-.9-2.3c-.9-.9-1.9-.9-2.3-1C17.3 2.6 12 2.6 12 2.6h0s-5.3 0-8.3.3c-.4 0-1.4.1-2.3 1-.7.7-.9 2.3-.9 2.3S.2 8.1.2 10v1.9c0 1.9.2 3.8.2 3.8s.2 1.6.9 2.3c.9.9 2 .9 2.5 1 1.8.2 7.7.3 7.7.3s5.3 0 8.3-.3c.4 0 1.4-.1 2.3-1 .7-.7.9-2.3.9-2.3s.2-1.9.2-3.8V10c0-1.9-.2-3.8-.2-3.8z" fill="#FF0033"/><path d="M9.6 14.1V7.9l6 3.1-6 3.1z" fill="#fff"/></svg>`;

      let ALL_ACCOUNTS_CACHE = [];

      async function loadYoutubeChannels() {
        const res = await authedFetch("/accounts/");
        const accounts = res.ok ? await res.json() : [];
        ALL_ACCOUNTS_CACHE = accounts;
        const ytAccounts = accounts.filter((a) => a.platform === "youtube");
        const list = document.getElementById("yt-channel-list");
        if (ytAccounts.length === 0) {
          list.innerHTML =
            '<span class="yt-empty">No YouTube channels visible to this user.</span>';
          return;
        }
        list.innerHTML = ytAccounts
          .map(
            (a) => `
          <div class="yt-chip">
            ${YT_ICON}
            <span class="yt-chip-name">${a.account_name}</span>
            <span class="yt-chip-live" title="Connected"></span>
          </div>
        `,
          )
          .join("");
      }

      async function loadAccounts() {
        const res = await authedFetch("/accounts/");
        const accounts = res.ok ? await res.json() : [];
        const select = document.getElementById("cf-account");
        const knownDemoNames = [
          "TV9 Main Channel",
          "tv9official",
          "TV9 Bharatvarsh",
          "@TV9Bharatvarsh",
        ];
        const sorted = [...accounts].sort((a, b) => {
          const aFake = knownDemoNames.includes(a.account_name) ? 1 : 0;
          const bFake = knownDemoNames.includes(b.account_name) ? 1 : 0;
          return aFake - bFake;
        });
        if (sorted.length === 0) {
          select.innerHTML =
            '<option value="">(no accounts visible to this user)</option>';
          return;
        }
        select.innerHTML = sorted
          .map((a) => {
            const isFake = knownDemoNames.includes(a.account_name);
            const label = isFake
              ? `${a.platform.toUpperCase()} — ${a.account_name} (demo — will fail if published)`
              : `${a.platform.toUpperCase()} — ${a.account_name} (real, connected)`;
            return `<option value="${a.id}">${label}</option>`;
          })
          .join("");
      }

      async function createRealPost() {
        const title = document.getElementById("cf-title").value || "Untitled";
        const caption = document.getElementById("cf-caption").value || "";
        const filename =
          document.getElementById("cf-media").value || "test_clip.mp4";
        const accountId = document.getElementById("cf-account").value;
        if (!accountId) {
          alert(
            "No account selected — this user may not have access to any accounts.",
          );
          return;
        }

        const createRes = await authedFetch("/posts/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            caption,
            media_s3_key: `/app/media/${filename}`,
            media_type: "video",
            created_by: "dashboard",
            target_account_ids: [accountId],
            scheduled_for: new Date().toISOString(),
          }),
        });
        if (!createRes.ok) {
          const err = await createRes.json().catch(() => ({}));
          alert("Could not create post: " + (err.detail || createRes.status));
          return;
        }
        const post = await createRes.json();
        const target = post.targets[0];
        if (target.status !== "failed") {
          await authedFetch(`/posts/targets/${target.id}/publish-now`, {
            method: "POST",
          });
        }
        LAST_POSTS_SNAPSHOT = null; // force render since we know something changed
        fetchPosts();
      }

      async function publishReal(targetId) {
        await authedFetch(`/posts/targets/${targetId}/publish-now`, {
          method: "POST",
        });
        LAST_POSTS_SNAPSHOT = null;
        fetchPosts();
      }

      async function publishAll(postId) {
        await authedFetch(`/posts/${postId}/publish-all`, { method: "POST" });
        LAST_POSTS_SNAPSHOT = null;
        fetchPosts();
      }

      async function callDemo(action) {
        await authedFetch(`/demo/${action}`, { method: "POST" });
        LAST_POSTS_SNAPSHOT = null;
        await loadYoutubeChannels();
        fetchPosts();
      }

      async function retryPublish(targetId) {
        LAST_POSTS_SNAPSHOT = null;
        await publishReal(targetId);
      }

      function segNumber(i) {
        return String(i + 1).padStart(2, "0");
      }

      // ---------- Flicker fix ----------
      // Previously, fetchPosts() rebuilt the entire #posts innerHTML every
      // 2 seconds unconditionally, even when the data hadn't changed. Every
      // .post-card has a CSS entrance animation (fadein), so rebuilding the
      // DOM every 2s re-triggered that animation constantly, producing the
      // "coming in and out" flicker. Fix: keep a snapshot of the last
      // rendered data and skip the re-render entirely if nothing changed.
      function updateKpiStrip(posts) {
        let published = 0, pending = 0, failed = 0;
        posts.forEach((post) => {
          post.targets.forEach((t) => {
            if (t.status === "published") published++;
            else if (t.status === "failed") failed++;
            else pending++; // pending or publishing counted as in-progress
          });
        });
        document.getElementById("kpi-total").textContent = posts.length;
        document.getElementById("kpi-published").textContent = published;
        document.getElementById("kpi-pending").textContent = pending;
        document.getElementById("kpi-failed").textContent = failed;
      }

      async function deletePost(postId) {
        if (!confirm("Delete this post? This can't be undone.")) return;
        const res = await authedFetch(`/posts/${postId}`, { method: "DELETE" });
        if (!res.ok && res.status !== 204) {
          const err = await res.json().catch(() => ({}));
          alert("Could not delete post: " + (err.detail || res.status));
          return;
        }
        LAST_POSTS_SNAPSHOT = null;
        fetchPosts();
      }

      let LAST_POSTS_SNAPSHOT = null;

      async function fetchPosts() {
        const res = await authedFetch("/posts/");
        if (!res.ok) return;
        const posts = await res.json();

        updateKpiStrip(posts); // always keep KPIs live, independent of the render-skip below

        const snapshot = JSON.stringify(posts);
        if (snapshot === LAST_POSTS_SNAPSHOT) return; // nothing changed — skip render
        LAST_POSTS_SNAPSHOT = snapshot;

        const container = document.getElementById("posts");

        if (posts.length === 0) {
          container.innerHTML =
            '<div class="empty">No segments in today\'s rundown yet.</div>';
          return;
        }

        container.innerHTML = posts
          .map((post, i) => {
            const isDemo = post.created_by === "demo-seed";
            const pendingCount = post.targets.filter(
              (t) => t.status === "pending",
            ).length;
            return `
        <div class="post-card" style="animation-delay:${Math.min(i * 40, 320)}ms">
          <div class="seg-number">${segNumber(i)}</div>
          <div class="post-body">
            <div class="post-title-row">
              <div class="post-title">
                ${post.title || "(untitled)"}
                <span class="badge ${isDemo ? "demo" : "real"}">${isDemo ? "Demo" : "Real"}</span>
              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                ${!isDemo && pendingCount > 1 ? `<button class="publish-all-btn" onclick="publishAll('${post.id}')">Publish all ${pendingCount} now</button>` : ""}
                <button class="secondary delete-btn" onclick="deletePost('${post.id}')" title="Delete this post">Delete</button>
              </div>
            </div>
            <div class="post-caption">${post.caption || ""}</div>
            <div class="targets">
              ${post.targets
                .map((t) => {
                  const isYoutube = t.platform === "youtube";

                  const publishBtn =
                    !isDemo && t.status === "pending"
                      ? `<button onclick="publishReal('${t.id}')">Publish now</button>`
                      : "";

                  const retryBtn =
                    !isDemo && t.status === "failed" && isYoutube
                      ? `<button class="retry-btn" onclick="retryPublish('${t.id}')">Retry</button>`
                      : "";

                  const errorLine = t.error_message
                    ? `<div class="target-error">${t.error_message}</div>`
                    : "";

                  const attemptsLine =
                    t.attempts > 0
                      ? `<div class="target-attempts">attempts: ${t.attempts}</div>`
                      : "";

                  // While a YouTube upload is in flight, show a moving
                  // progress bar instead of just the pulsing dot — much
                  // clearer in a live demo that real work is happening.
                  const progressBar =
                    isYoutube && t.status === "publishing"
                      ? `<div class="yt-progress-track"><div class="yt-progress-fill"></div></div>`
                      : "";

                  // Real inline video playback for published YouTube
                  // targets, instead of just a text link out.
                  const ytEmbed =
                    isYoutube && t.status === "published" && t.platform_post_id
                      ? `<div class="yt-embed-wrap">
                           <iframe src="https://www.youtube-nocookie.com/embed/${t.platform_post_id}"
                             title="YouTube video player" frameborder="0"
                             allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                             allowfullscreen loading="lazy"></iframe>
                         </div>`
                      : "";

                  return `
                <div class="target ${isYoutube ? "yt-target" : ""}">
                  <div class="target-main">
                    <span class="dot ${t.status}"></span>
                    <strong>${(t.platform || "?").toUpperCase()}</strong>
                    <span class="target-status">${t.status}</span>
                    ${publishBtn}${retryBtn}
                  </div>
                  ${progressBar}
                  ${errorLine}
                  ${attemptsLine}
                  ${ytEmbed}
                </div>
              `;
                })
                .join("")}
            </div>
          </div>
        </div>
      `;
          })
          .join("");
      }

      initAuth().then(async () => {
        await loadUserSwitcher();
        await loadAccounts();
        await loadYoutubeChannels();
        fetchPosts();
        setInterval(fetchPosts, 2000); // auto-refresh every 2s during the demo
      });
    </script>
  </body>
</html>
